<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAP-C02 背考助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ff9900'/></svg>" />
  <style>
:root {
  --bg: #0f1420;
  --panel: #171e2e;
  --panel-2: #1f2840;
  --border: #2a3550;
  --text: #e6ebf5;
  --muted: #93a0bb;
  --accent: #ff9900;
  --accent-2: #ffb84d;
  --ok: #2fbf71;
  --warn: #f2c94c;
  --bad: #eb5757;
  --radius: 12px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: rgba(15, 20, 32, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #e57a00);
  color: #111;
  font-weight: 800;
}
.title { font-weight: 700; font-size: 17px; }
.subtitle { color: var(--muted); font-size: 12px; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs a {
  color: var(--muted);
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 8px;
}
.tabs a:hover { color: var(--text); background: var(--panel); }
.tabs a.active { color: #111; background: var(--accent); font-weight: 600; }

.container { max-width: 960px; margin: 0 auto; padding: 24px; }

.footer {
  max-width: 960px;
  margin: 0 auto;
  padding: 8px 24px 32px;
  color: var(--muted);
  font-size: 13px;
}

kbd {
  display: inline-block;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--panel);
  font-size: 12px;
}

h2 { margin: 0 0 16px; font-size: 20px; }
h3 { margin: 0 0 8px; font-size: 16px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

.stat .num { font-size: 28px; font-weight: 700; color: var(--accent-2); }
.stat .label { color: var(--muted); font-size: 13px; }

.domain-row { margin-bottom: 14px; }
.domain-row .head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
.domain-row .head span:last-child { color: var(--muted); }

.bar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; }
.bar .ok { background: var(--ok); }
.bar .mid { background: var(--warn); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }

select, input[type="search"] {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font: inherit;
}
input[type="search"] { flex: 1; min-width: 200px; }

.btn {
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  padding: 9px 16px;
  border-radius: 8px;
  font: inherit;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); }
.btn.bad { border-color: var(--bad); color: #ffb3b3; }
.btn.mid { border-color: var(--warn); color: #ffe7a3; }
.btn.ok { border-color: var(--ok); color: #a8f0c8; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.pill {
  display: inline-block;
  font-size: 12px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--muted);
  border: 1px solid var(--border);
  margin-right: 6px;
}
.pill.domain { color: var(--accent-2); border-color: #5a4320; }

.flashcard {
  min-height: 260px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  user-select: none;
}
.flashcard .q { font-size: 19px; font-weight: 600; margin: 12px 0; }
.flashcard .a {
  border-top: 1px dashed var(--border);
  padding-top: 14px;
  margin-top: 8px;
  white-space: pre-wrap;
}
.flashcard .hint { color: var(--muted); font-size: 13px; margin-top: auto; }

.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.progress-text { color: var(--muted); font-size: 13px; margin-left: auto; }

.stem { font-size: 16px; margin: 10px 0 16px; }
.options { display: grid; gap: 10px; }
.option {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  text-align: left;
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
.option:hover:not(:disabled) { border-color: var(--accent); }
.option .letter {
  flex: none;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  background: var(--panel);
  font-weight: 700;
}
.option.selected { border-color: var(--accent); background: #2b2a2a; }
.option.correct { border-color: var(--ok); background: rgba(47, 191, 113, 0.12); }
.option.wrong { border-color: var(--bad); background: rgba(235, 87, 87, 0.12); }
.option:disabled { cursor: default; }

.explain {
  margin-top: 16px;
  padding: 14px;
  border-radius: 10px;
  background: var(--panel-2);
  border-left: 4px solid var(--accent);
}
.explain.ok { border-left-color: var(--ok); }
.explain.bad { border-left-color: var(--bad); }

.actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

.kw-table { width: 100%; border-collapse: collapse; }
.kw-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.kw-table td:first-child { color: var(--accent-2); width: 40%; font-weight: 600; }
.kw-table mark { background: rgba(255, 153, 0, 0.35); color: inherit; border-radius: 3px; }

.list-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: none; }
.muted { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

.score { font-size: 42px; font-weight: 800; color: var(--accent-2); }

.start { border-color: #5a4320; background: linear-gradient(135deg, #1f1a12, var(--panel)); }
.notice { border-color: #5a4320; }

.toc {
  position: sticky;
  top: 72px;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 0;
  margin-bottom: 8px;
  background: var(--bg);
}
.toc a {
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
}
.toc a:hover { color: var(--text); border-color: var(--accent); }

section { scroll-margin-top: 130px; }
a { color: var(--accent-2); }

.steps { margin: 0; padding-left: 20px; }
.steps li { margin-bottom: 12px; }
.steps li div { color: var(--muted); }

.seg { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.seg .btn { padding: 6px 12px; }

.tip p { margin: 8px 0; }
.tip.done { opacity: 0.6; }
.tip-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tip-head h3 { margin: 0; flex: 1; min-width: 200px; }
.done-toggle { color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.chip {
  font-size: 12px;
  padding: 1px 8px;
  border-radius: 6px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--accent-2);
  text-decoration: none;
}
.chip:hover { border-color: var(--accent); }
.chip.warn { color: var(--warn); border-style: dashed; }

.domain-block { padding: 12px 0; border-bottom: 1px solid var(--border); }
.domain-block:last-child { border-bottom: none; }
.domain-block ol { margin: 8px 0; padding-left: 20px; }

.kw-table.duel td:first-child { width: 30%; }
.pitfalls { margin: 0; padding-left: 20px; }
.pitfalls li { margin-bottom: 6px; }

.pill.warn { color: var(--warn); border-color: #6b5a1f; }
.warn-text { color: #ffe7a3; }
.grip-line {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(255, 153, 0, 0.08);
  border: 1px dashed #5a4320;
}
.explain > div { margin-top: 8px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--muted); }
code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }

.recall-item { padding: 16px 20px; }
.recall-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.recall-grip { font-size: 16px; font-weight: 600; margin: 10px 0 8px; }
.recall-keys { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.key {
  padding: 2px 10px;
  border-radius: 6px;
  background: rgba(255, 153, 0, 0.18);
  color: var(--accent-2);
  font-weight: 600;
}
.recall-hint { margin-bottom: 6px; }
.recall-answer, .recall-opt {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid var(--ok);
  background: rgba(47, 191, 113, 0.1);
}
.recall-opt { border-color: var(--border); background: var(--panel-2); }
.recall-opt.ok { border-color: var(--ok); }
.recall-answer .letter, .recall-opt .letter { flex: none; font-weight: 700; color: var(--ok); }
.recall-answer mark { background: rgba(255, 153, 0, 0.35); color: inherit; border-radius: 3px; padding: 0 2px; }
.recall-full { margin-top: 8px; }
.recall-full .stem { font-size: 14px; margin: 8px 0; }
.link-btn { background: none; border: none; color: var(--muted); padding: 8px 0 0; font: inherit; font-size: 13px; cursor: pointer; }
.link-btn:hover { color: var(--accent-2); }
.small { font-size: 13px; margin-top: 6px; }
.pager { justify-content: center; align-items: center; margin: 0 0 16px; }

@media (max-width: 600px) {
  .container { padding: 16px; }
  .topbar { padding: 10px 16px; }
  .grade { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">C02</span>
      <div>
        <div class="title">SAP-C02 背考助手</div>
        <div class="subtitle">AWS Certified Solutions Architect – Professional</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#/home" data-view="home">概览</a>
      <a href="#/method" data-view="method">方法论</a>
      <a href="#/recall" data-view="recall">速记</a>
      <a href="#/bank" data-view="bank">真题库</a>
      <a href="#/cards" data-view="cards">闪卡</a>
      <a href="#/quiz" data-view="quiz">练习题</a>
      <a href="#/wrong" data-view="wrong">错题本</a>
      <a href="#/keywords" data-view="keywords">关键词速查</a>
    </nav>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    进度保存在本机浏览器（localStorage）。快捷键：闪卡 <kbd>空格</kbd> 翻面，<kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> 评分；练习与真题库 <kbd>A</kbd>–<kbd>F</kbd> 选择，<kbd>Enter</kbd> 提交/下一题，真题库 <kbd>H</kbd> 看抓手、<kbd>←</kbd>/<kbd>→</kbd> 翻题。
  </footer>
  <script>
window.SAP_DATA = {
  domains: {
    d1: { name: "复杂组织的解决方案设计", weight: 26 },
    d2: { name: "新解决方案设计", weight: 29 },
    d3: { name: "现有解决方案的持续改进", weight: 25 },
    d4: { name: "加速工作负载迁移与现代化", weight: 20 },
  },

  cards: [
    // ---------- 领域 1：复杂组织 ----------
    { id: "c001", d: "d1", tags: ["Organizations", "SCP"],
      q: "SCP（服务控制策略）能授予权限吗？对管理账户生效吗？",
      a: "不能授予，只设定权限上限（护栏）；最终权限 = IAM 策略 ∩ SCP。SCP 对管理账户（Management Account）不生效，也不影响服务关联角色。" },
    { id: "c002", d: "d1", tags: ["Organizations", "SCP"],
      q: "想禁止成员账户离开组织、关闭 CloudTrail、或在未批准的区域创建资源，用什么？",
      a: "在 OU/根上挂 SCP：Deny organizations:LeaveOrganization、Deny cloudtrail:StopLogging/DeleteTrail，以及基于 aws:RequestedRegion 条件的区域限制 Deny（注意给全局服务如 IAM、CloudFront、Route 53 留例外）。" },
    { id: "c003", d: "d1", tags: ["Control Tower"],
      q: "AWS Control Tower 提供了什么？",
      a: "多账户 Landing Zone 自动化：创建 Log Archive 与 Audit 账户、Account Factory（基于 Service Catalog）开户、预防性控制（SCP）、检测性控制（Config 规则）、主动控制（CloudFormation Hooks），以及合规仪表板。" },
    { id: "c004", d: "d1", tags: ["IAM Identity Center"],
      q: "多账户统一登录、对接企业 AD / 外部 IdP（Okta、Entra ID）的首选方案？",
      a: "IAM Identity Center（原 AWS SSO）：在组织管理账户（或委派管理员账户）启用，用权限集（Permission Set）分配到账户；身份源可选内置目录、AD Connector / AWS Managed Microsoft AD，或通过 SAML 2.0 + SCIM 对接外部 IdP。" },
    { id: "c005", d: "d1", tags: ["RAM"],
      q: "AWS RAM 可以共享哪些常考资源？",
      a: "VPC 子网（共享 VPC）、Transit Gateway、Route 53 Resolver 规则、License Manager 配置、Aurora 数据库集群（克隆）、Network Firewall 策略、Prefix List、IPAM 池等。共享子网时参与账户可在其中创建资源，但不能修改 VPC。" },
    { id: "c006", d: "d1", tags: ["网络", "Transit Gateway"],
      q: "上百个 VPC + 本地数据中心互联，避免 VPC Peering 网状结构，用什么？",
      a: "Transit Gateway（区域级中心辐射路由器），可通过 RAM 跨账户共享；用多个路由表实现隔离（如生产/开发分段）；跨区域使用 TGW Peering；本地通过 Direct Connect Gateway（Transit VIF）或 Site-to-Site VPN 接入。" },
    { id: "c007", d: "d1", tags: ["网络", "VPC Peering"],
      q: "VPC Peering 的关键限制有哪些？",
      a: "不支持传递路由（A-B、B-C 不代表 A-C）；CIDR 不能重叠；不支持边缘到边缘路由（不能借对端的 IGW/VPN/DX）。优点：无带宽瓶颈、无额外小时费、延迟低。" },
    { id: "c008", d: "d1", tags: ["网络", "Direct Connect"],
      q: "Direct Connect 的三种虚拟接口（VIF）分别做什么？",
      a: "Private VIF：连接单个 VGW 或 DX Gateway（访问 VPC 私有 IP）；Public VIF：访问 AWS 公共端点（S3、DynamoDB 等公网 IP）；Transit VIF：连接 DX Gateway，再关联 Transit Gateway。" },
    { id: "c009", d: "d1", tags: ["网络", "Direct Connect"],
      q: "Direct Connect 本身加密吗？如何实现加密和高可用？",
      a: "默认不加密。加密：在 DX 上跑 Site-to-Site VPN（Public VIF 或 Transit VIF 上的私有 IP VPN），或在支持的 10/100G 专用连接上使用 MACsec。最高弹性：两个 DX 位置 × 每个位置两条独立连接；经济型备份：DX + VPN 备份。" },
    { id: "c010", d: "d1", tags: ["网络", "DNS"],
      q: "本地 DNS 需要解析 AWS 私有托管区记录，AWS 需要解析本地域名，怎么做？",
      a: "Route 53 Resolver：入站端点（Inbound Endpoint）让本地 DNS 转发到 AWS；出站端点（Outbound Endpoint）+ 转发规则让 VPC 解析本地域名。转发规则可通过 RAM 共享给其他账户的 VPC。" },
    { id: "c011", d: "d1", tags: ["网络", "PrivateLink"],
      q: "向数百个消费者 VPC 暴露一个服务，且 CIDR 可能重叠，用什么？",
      a: "AWS PrivateLink：服务端用 NLB（或 GWLB）建立 Endpoint Service，消费者创建接口终端节点。单向访问、无需路由、容忍 CIDR 重叠。" },
    { id: "c012", d: "d1", tags: ["网络", "VPC Endpoint"],
      q: "Gateway Endpoint 与 Interface Endpoint 的区别？",
      a: "Gateway Endpoint 仅支持 S3 和 DynamoDB，通过路由表生效、免费，但本地/对等 VPC 无法经它访问。Interface Endpoint（PrivateLink）是子网内的 ENI，按小时+流量收费，可从本地（经 DX/VPN）和对等网络访问。" },
    { id: "c013", d: "d1", tags: ["安全", "集中审计"],
      q: "组织范围内集中收集日志、汇总安全发现，常见组合是什么？",
      a: "组织级 CloudTrail Trail 写入 Log Archive 账户的 S3（配合 S3 Object Lock 防篡改）；GuardDuty / Security Hub / Macie / Inspector / Config 聚合器使用委派管理员（Delegated Administrator）放在 Audit/Security 账户。" },
    { id: "c014", d: "d1", tags: ["成本", "Organizations"],
      q: "多账户如何管理成本与分摊？",
      a: "整合账单（Consolidated Billing）共享 RI/Savings Plans 折扣与阶梯价；成本分配标签（Cost Allocation Tags）需在管理账户中激活；可用 Tag Policies 强制标签规范；AWS Budgets + Budget Actions 自动响应；Cost Anomaly Detection 识别异常。" },
    { id: "c015", d: "d1", tags: ["IAM", "跨账户"],
      q: "第三方 SaaS 需要访问你的账户，如何防止“混淆代理”问题？",
      a: "创建跨账户 IAM 角色，信任策略中指定第三方账户 ID，并加 Condition sts:ExternalId（由第三方为每个客户生成的唯一值）。" },
    { id: "c016", d: "d1", tags: ["IAM", "权限边界"],
      q: "允许开发者自己创建 IAM 角色，但不能借此提权，怎么做？",
      a: "使用权限边界（Permissions Boundary）：要求开发者创建的角色必须附加指定的边界策略（通过 iam:PermissionsBoundary 条件强制），有效权限 = 身份策略 ∩ 边界。" },

    // ---------- 领域 2：新方案设计 ----------
    { id: "c101", d: "d2", tags: ["DR"],
      q: "四种灾难恢复策略按 RTO/RPO 和成本排序？",
      a: "备份与还原（小时级，最便宜）→ 指示灯 Pilot Light（核心数据实时复制、计算关闭，数十分钟）→ 温备 Warm Standby（缩小规模的完整环境一直运行，分钟级）→ 多站点主动/主动（接近零，最贵）。" },
    { id: "c102", d: "d2", tags: ["DR", "Aurora"],
      q: "Aurora Global Database 的 RPO / RTO 大致是多少？",
      a: "跨区域存储级复制，典型延迟 < 1 秒，RPO 约 1 秒，计划外故障切换（托管或手动提升）RTO 约 1 分钟级；最多 5 个次要区域，次要区域可提供只读。也支持写转发（Write Forwarding）。" },
    { id: "c103", d: "d2", tags: ["DR", "DynamoDB"],
      q: "DynamoDB 多区域主动/主动写入用什么？",
      a: "DynamoDB Global Tables：多区域多主复制，最后写入者获胜（Last Writer Wins）冲突解决，通常秒级复制延迟。需启用 DynamoDB Streams（新版本自动处理）。" },
    { id: "c104", d: "d2", tags: ["DR", "Elastic Disaster Recovery"],
      q: "本地或其他云的服务器以最低成本实现分钟级 RTO、秒级 RPO 的 DR？",
      a: "AWS Elastic Disaster Recovery（DRS）：块级持续复制到 AWS 低成本暂存区，故障时启动恢复实例，RPO 秒级、RTO 分钟级，也支持故障回切。" },
    { id: "c105", d: "d2", tags: ["Route 53"],
      q: "Route 53 路由策略都有哪些，各自适用场景？",
      a: "简单；加权（灰度/蓝绿）；基于延迟（最低延迟区域）；故障转移（主备 + 健康检查）；地理位置（按用户所在地，合规/本地化）；地理邻近（可用 bias 调整，需 Traffic Flow）；多值应答（最多 8 个健康记录）；基于 IP（按客户端 CIDR）。" },
    { id: "c106", d: "d2", tags: ["Global Accelerator", "CloudFront"],
      q: "Global Accelerator 与 CloudFront 怎么选？",
      a: "CloudFront：HTTP(S) 内容缓存与边缘计算。Global Accelerator：TCP/UDP 加速，提供 2 个静态 Anycast IP，秒级区域故障转移，适合游戏、IoT、VoIP、需要固定 IP 白名单的非 HTTP 场景。" },
    { id: "c107", d: "d2", tags: ["存储", "S3"],
      q: "S3 存储类别按访问频率怎么选？",
      a: "Standard（频繁）；Intelligent-Tiering（访问模式未知/变化）；Standard-IA 与 One Zone-IA（不频繁，后者单 AZ 可重建数据）；Glacier Instant Retrieval（季度访问、毫秒取回）；Glacier Flexible Retrieval（分钟到小时）；Glacier Deep Archive（12–48 小时，最便宜，长期合规归档）。" },
    { id: "c108", d: "d2", tags: ["存储", "S3"],
      q: "需要 WORM（一次写入多次读取）合规存储，且连 root 都不能删？",
      a: "S3 Object Lock 合规模式（Compliance Mode）+ 保留期；治理模式（Governance Mode）允许有特殊权限的用户绕过。另有 Legal Hold（无期限）。Glacier 可用 Vault Lock。" },
    { id: "c109", d: "d2", tags: ["存储", "共享文件系统"],
      q: "EFS、FSx for Windows、FSx for Lustre、FSx for NetApp ONTAP 怎么选？",
      a: "EFS：Linux NFS 共享、弹性扩展。FSx for Windows：SMB、AD 集成、DFS。FSx for Lustre：HPC/ML 高吞吐，可与 S3 关联。FSx for NetApp ONTAP：多协议（NFS/SMB/iSCSI）、快照/SnapMirror，适合从本地 NetApp 迁移。FSx for OpenZFS：从 ZFS 迁移。" },
    { id: "c110", d: "d2", tags: ["数据库"],
      q: "数据库选型速记？",
      a: "关系型 OLTP：RDS / Aurora；键值超大规模毫秒级：DynamoDB（DAX 微秒缓存）；缓存/会话：ElastiCache（Redis/Valkey/Memcached）；文档：DocumentDB；图：Neptune；时序：Timestream；账本不可篡改：QLDB（已宣布停用，新方案用 Aurora PostgreSQL 审计）；宽列 Cassandra：Keyspaces；数仓：Redshift。" },
    { id: "c111", d: "d2", tags: ["解耦", "消息"],
      q: "SQS、SNS、EventBridge、Kinesis 怎么区分？",
      a: "SQS：点对点队列，解耦削峰（FIFO 保证顺序和恰好一次）。SNS：发布订阅扇出。EventBridge：基于规则的事件总线，支持 SaaS 事件源、跨账户、Schema、重放与 Pipes。Kinesis Data Streams：实时流、有序分片、多消费者重放。" },
    { id: "c112", d: "d2", tags: ["计算", "无服务器"],
      q: "Lambda 关键限制？",
      a: "最长运行 15 分钟；内存 128 MB–10 GB（CPU 按比例）；/tmp 最高 10 GB；同步负载 6 MB；默认区域并发 1000（可提额）。冷启动可用预置并发或 SnapStart（Java/Python/.NET）。超过 15 分钟的任务改用 Step Functions、ECS/Fargate 或 Batch。" },
    { id: "c113", d: "d2", tags: ["计算", "容器"],
      q: "ECS on EC2、Fargate、EKS 怎么选？",
      a: "Fargate：无需管理服务器，按任务计费。ECS on EC2：需要 GPU、特定实例类型或更低成本（配合 Spot/RI）。EKS：需要 Kubernetes 生态/可移植性；EKS Anywhere / ECS Anywhere 用于本地。" },
    { id: "c114", d: "d2", tags: ["编排", "Step Functions"],
      q: "Step Functions 标准与快速工作流的区别？",
      a: "标准：最长 1 年，恰好一次执行，按状态转换计费，适合长流程/人工审批。快速（Express）：最长 5 分钟，至少一次，按执行和时长计费，适合高吞吐事件处理。" },
    { id: "c115", d: "d2", tags: ["安全", "加密"],
      q: "KMS 与 CloudHSM 什么时候选后者？",
      a: "需要单租户、客户独占控制的 FIPS 140-2/3 Level 3 HSM，或需要 PKCS#11/JCE/CNG 等标准接口、SSL 卸载、TDE 时选 CloudHSM。也可作为 KMS 自定义密钥存储（Custom Key Store）。普通场景选 KMS。" },
    { id: "c116", d: "d2", tags: ["安全", "加密"],
      q: "KMS 跨区域与跨账户的要点？",
      a: "跨账户：密钥策略中授权对方账户 + 对方 IAM 策略也要允许。跨区域：使用多区域密钥（Multi-Region Keys），同一密钥 ID 和材料可在多区域复制，便于全局表或跨区域加密数据解密。" },
    { id: "c117", d: "d2", tags: ["安全", "边界防护"],
      q: "防御 DDoS 和 Web 攻击的组合？",
      a: "Shield Standard（免费，L3/L4）；Shield Advanced（DRT 支持、成本保护、L7 自动缓解）；WAF（SQLi/XSS、速率限制、托管规则、Bot Control）挂在 CloudFront / ALB / API Gateway / AppSync；Firewall Manager 在组织内统一下发 WAF/Shield/安全组/Network Firewall 策略。" },
    { id: "c118", d: "d2", tags: ["安全", "机密管理"],
      q: "Secrets Manager 与 Parameter Store 区别？",
      a: "Secrets Manager：内置自动轮换（RDS/Redshift/DocumentDB 等原生支持，Lambda 自定义轮换）、跨区域复制，收费。Parameter Store：配置与简单机密存储，标准层免费，无原生轮换。" },
    { id: "c119", d: "d2", tags: ["数据分析"],
      q: "S3 数据湖上的查询与治理组合？",
      a: "Glue 爬网程序 + Data Catalog 建元数据；Athena 无服务器 SQL；Redshift Spectrum 从数仓查 S3；Lake Formation 提供表/列/行级权限与跨账户共享；EMR 用于大规模 Spark/Hadoop；QuickSight 可视化。" },
    { id: "c120", d: "d2", tags: ["API"],
      q: "API Gateway 的 REST API、HTTP API、WebSocket API 怎么选？",
      a: "HTTP API：更便宜、更低延迟，支持 JWT/OIDC 授权。REST API：功能全（API Key、使用计划、请求校验、WAF、私有 API、缓存）。WebSocket API：双向实时通信（聊天、推送）。" },

    // ---------- 领域 3：持续改进 ----------
    { id: "c201", d: "d3", tags: ["成本", "购买选项"],
      q: "Savings Plans 与 Reserved Instances 怎么选？",
      a: "Compute Savings Plans：最灵活，覆盖 EC2（任意族/区域/OS）、Fargate、Lambda。EC2 Instance Savings Plans：锁定区域+实例族，折扣更高。标准 RI 折扣高但灵活性低；可转换 RI 可换族。RDS、ElastiCache、Redshift、OpenSearch 等仍需对应的预留节点/实例。" },
    { id: "c202", d: "d3", tags: ["成本", "Spot"],
      q: "Spot 实例适用场景与中断处理？",
      a: "适合无状态、可中断、容错的工作负载（批处理、CI、大数据、容器）。2 分钟中断通知（EventBridge / 实例元数据）；配合 Auto Scaling 混合实例策略、容量再平衡、price-capacity-optimized 分配策略分散到多种实例类型。" },
    { id: "c203", d: "d3", tags: ["成本", "优化工具"],
      q: "找出闲置/过度配置资源的工具？",
      a: "Compute Optimizer（EC2、EBS、Lambda、ECS on Fargate、RDS 规格建议）；Trusted Advisor（成本、安全、容错、性能、服务配额检查）；Cost Explorer（RI/SP 购买建议与使用率）；Cost Optimization Hub 汇总建议。" },
    { id: "c204", d: "d3", tags: ["性能", "缓存"],
      q: "读密集型数据库负载过高，有哪些缓解手段？",
      a: "增加只读副本（RDS 最多 15 个，Aurora 15 个）；ElastiCache 旁路缓存（Lazy Loading）或写穿（Write-through）；DynamoDB 用 DAX；前端用 CloudFront 缓存；使用 RDS Proxy 缓解连接风暴（尤其 Lambda 场景）。" },
    { id: "c205", d: "d3", tags: ["可靠性", "数据库"],
      q: "Lambda 大量并发连接压垮 RDS，最佳方案？",
      a: "RDS Proxy：连接池复用、减少故障转移时间（最多降低约 66%），支持 IAM 认证和 Secrets Manager 凭证。" },
    { id: "c206", d: "d3", tags: ["运维", "Systems Manager"],
      q: "Systems Manager 常考功能？",
      a: "Session Manager（无需堡垒机/SSH 端口登录，日志到 S3/CloudWatch）；Patch Manager + 维护时段；Run Command；State Manager；Automation 运行手册（可被 Config 修复调用）；Parameter Store；Inventory；OpsCenter；Change Manager。" },
    { id: "c207", d: "d3", tags: ["合规", "Config"],
      q: "检测到不合规资源后自动修复，怎么设计？",
      a: "AWS Config 规则（托管或自定义）+ 修复操作（SSM Automation 文档），可设为自动修复；组织范围使用 Conformance Packs 与组织 Config 规则；也可通过 EventBridge 触发 Lambda。" },
    { id: "c208", d: "d3", tags: ["部署", "CI/CD"],
      q: "部署策略：In-place、滚动、蓝绿、金丝雀的区别？",
      a: "In-place：原地更新，有停机风险。滚动：分批替换。蓝绿：新旧两套环境，切流量（Route 53 加权 / ALB / CodeDeploy），回滚快。金丝雀/线性：先切小比例流量（CodeDeploy 支持 Lambda、ECS），配合 CloudWatch 告警自动回滚。" },
    { id: "c209", d: "d3", tags: ["监控", "可观测性"],
      q: "分布式应用的端到端追踪与监控工具？",
      a: "X-Ray（追踪与服务地图，可用 ADOT/OpenTelemetry）；CloudWatch ServiceLens / Application Signals；CloudWatch Synthetics（金丝雀脚本模拟用户）；RUM（真实用户监控）；Container Insights / Lambda Insights；Logs Insights 查询日志。" },
    { id: "c210", d: "d3", tags: ["可靠性", "Auto Scaling"],
      q: "EC2 Auto Scaling 的扩缩策略有哪些？",
      a: "目标跟踪（如 CPU 50%，最推荐）；步进扩缩；简单扩缩；计划扩缩（已知高峰）；预测扩缩（基于历史 ML 预测）。可配合预热池（Warm Pools）缩短启动时间，生命周期挂钩做初始化/清理。" },
    { id: "c211", d: "d3", tags: ["安全", "威胁检测"],
      q: "GuardDuty、Inspector、Macie、Detective、Security Hub 各干什么？",
      a: "GuardDuty：基于 CloudTrail/VPC 流日志/DNS 日志等的威胁检测。Inspector：EC2/ECR 镜像/Lambda 漏洞扫描。Macie：S3 敏感数据（PII）发现。Detective：安全事件调查与根因分析。Security Hub：汇总发现与合规基准（CIS、FSBP）。" },
    { id: "c212", d: "d3", tags: ["性能", "存储"],
      q: "EBS 卷类型怎么选？",
      a: "gp3：通用默认，IOPS/吞吐可独立配置，比 gp2 便宜。io2 Block Express：最高 256,000 IOPS、亚毫秒延迟，关键数据库，支持多重挂载。st1：吞吐优化 HDD（大数据、日志）。sc1：冷 HDD 最便宜。HDD 不能作启动卷。" },
    { id: "c213", d: "d3", tags: ["可靠性", "弹性"],
      q: "如何验证架构在故障下的韧性？",
      a: "AWS Fault Injection Service（FIS）做混沌实验；AWS Resilience Hub 根据 RTO/RPO 目标评估应用韧性并给出建议；Route 53 ARC（应用恢复控制器）做区域级就绪检查与路由控制、可用区转移（Zonal Shift）。" },
    { id: "c214", d: "d3", tags: ["S3", "性能"],
      q: "S3 上传/下载性能优化？",
      a: "分段上传（>100 MB 推荐，>5 GB 必须）；字节范围并行下载；S3 Transfer Acceleration 远距离上传；前缀并行（每前缀 3500 PUT / 5500 GET 每秒）；S3 Express One Zone 获得个位数毫秒延迟。" },

    // ---------- 领域 4：迁移与现代化 ----------
    { id: "c301", d: "d4", tags: ["迁移策略"],
      q: "迁移的 7R 策略分别是什么？",
      a: "Retire（下线）、Retain（保留）、Rehost（直接迁移/lift-and-shift）、Relocate（如 VMware Cloud on AWS 整体搬迁）、Repurchase（换成 SaaS）、Replatform（小改造，如迁到 RDS/Elastic Beanstalk）、Refactor/Re-architect（重构为云原生）。" },
    { id: "c302", d: "d4", tags: ["迁移发现"],
      q: "迁移前如何发现本地服务器及其依赖关系？",
      a: "AWS Application Discovery Service：无代理（Agentless Collector，针对 VMware vCenter）或基于代理（Discovery Agent，可采集进程与网络连接依赖）；数据汇入 Migration Hub。也可用 Migration Evaluator 做 TCO 业务论证。" },
    { id: "c303", d: "d4", tags: ["服务器迁移"],
      q: "大规模服务器直接迁移（Rehost）的首选工具？",
      a: "AWS Application Migration Service（MGN）：块级持续复制，测试启动后切换，停机时间分钟级。支持物理机、VMware、Hyper-V 及其他云。（SMS 已停用）" },
    { id: "c304", d: "d4", tags: ["数据库迁移"],
      q: "异构数据库迁移（如 Oracle → Aurora PostgreSQL）怎么做？",
      a: "先用 AWS SCT（Schema Conversion Tool）或 DMS Schema Conversion 转换模式与代码，再用 DMS 完成全量 + CDC 持续复制，最终切换。同构迁移可直接用 DMS 或原生工具（如 pg_dump、MySQL 二进制日志复制）。" },
    { id: "c305", d: "d4", tags: ["数据传输"],
      q: "大量数据迁移：网络 vs 离线设备如何选？",
      a: "粗算：数据量 ÷ 可用带宽 得出传输时间。带宽充裕：DataSync（自动化、校验、加密、调度）或 DX。时间不足或带宽有限：Snowball Edge（约 80 TB 可用）；PB 级可用多台 Snowball。（Snowmobile 已停用）" },
    { id: "c306", d: "d4", tags: ["数据传输", "DataSync"],
      q: "DataSync 与 Storage Gateway 的区别？",
      a: "DataSync：一次性或定期在线迁移/同步（NFS、SMB、HDFS、对象存储 → S3/EFS/FSx）。Storage Gateway：长期混合云存储——S3 File Gateway（NFS/SMB 映射 S3）、FSx File Gateway、Volume Gateway（iSCSI 缓存/存储模式）、Tape Gateway（替代物理磁带备份）。" },
    { id: "c307", d: "d4", tags: ["数据传输", "Transfer Family"],
      q: "合作伙伴必须继续用 SFTP/FTPS 上传文件到 S3？",
      a: "AWS Transfer Family：托管 SFTP/FTPS/FTP/AS2 服务端，后端存储为 S3 或 EFS，支持自定义身份提供程序和托管工作流。" },
    { id: "c308", d: "d4", tags: ["现代化"],
      q: "单体应用逐步拆分为微服务的模式？",
      a: "绞杀者模式（Strangler Fig）：在前端放 API Gateway / ALB 路由，按功能逐步把流量切到新服务。AWS Migration Hub Refactor Spaces 可托管这种增量重构的路由和网络。" },
    { id: "c309", d: "d4", tags: ["现代化", "容器"],
      q: "把 .NET / Java 应用快速容器化的工具？",
      a: "AWS App2Container（A2C）：分析运行中的应用，生成 Docker 镜像、ECS/EKS 任务定义与 CI/CD 流水线。" },
    { id: "c310", d: "d4", tags: ["迁移规划"],
      q: "AWS 迁移的三个阶段与对应工具？",
      a: "评估（Assess）：Migration Evaluator、迁移就绪评估（MRA）。动员（Mobilize）：Application Discovery Service、Landing Zone（Control Tower）、迁移计划。迁移与现代化（Migrate & Modernize）：MGN、DMS、DataSync 等，进度在 Migration Hub 跟踪。" },
    { id: "c311", d: "d4", tags: ["混合云"],
      q: "需要在本地数据中心运行 AWS 服务（低延迟/数据驻留）？",
      a: "AWS Outposts（机架或服务器形态，在本地运行 EC2、EBS、ECS、EKS、RDS 等）；Local Zones（靠近大城市的低延迟）；Wavelength（5G 边缘）。" },
    { id: "c312", d: "d4", tags: ["迁移", "VMware"],
      q: "不改动地把 VMware 工作负载迁到 AWS？",
      a: "Relocate 策略：VMware Cloud on AWS（使用 HCX 迁移）。若要转换为原生 EC2，则用 MGN 做 Rehost。" },
    { id: "c313", d: "d4", tags: ["数据库迁移", "大数据量"],
      q: "数据库数十 TB 且网络带宽有限，如何用 DMS 迁移？",
      a: "用 Snowball Edge 配合 DMS：SCT 数据提取代理把数据导到 Snowball Edge，寄回后加载到 S3，再由 DMS 导入目标库，并通过 CDC 追平增量。" },
  ],

  questions: [
    { id: "q001", d: "d1",
      stem: "某公司使用 AWS Organizations 管理 200 个账户。安全团队要求：任何账户都不能在 us-east-1 和 eu-west-1 以外的区域创建资源，且即使账户管理员也不能绕过。最佳方案是？",
      options: [
        "在每个账户中创建 IAM 策略，拒绝在其他区域的操作",
        "在组织根上附加 SCP，基于 aws:RequestedRegion 拒绝其他区域的操作，并为全局服务设置例外",
        "使用 AWS Config 规则检测其他区域的资源并发送通知",
        "使用 Control Tower 的检测性控制监控区域使用",
      ],
      answer: [1],
      explain: "SCP 是组织级护栏，成员账户管理员（包括 root）无法绕过。IAM 策略可被账户管理员修改；Config 和检测性控制只能发现问题而不能阻止。注意给 IAM、CloudFront、Route 53 等全局服务留例外。" },
    { id: "q002", d: "d1",
      stem: "公司有 50 个 VPC 分布在多个账户中，需要与本地数据中心互通，且 VPC 之间也要互通，同时生产与开发环境必须网络隔离。运维开销最小的方案是？",
      options: [
        "在所有 VPC 之间建立全网状 VPC Peering，并为每个 VPC 建立 VPN",
        "部署 Transit Gateway 并通过 RAM 共享；用 DX Gateway 和 Transit VIF 接入本地；为生产和开发使用独立的 TGW 路由表",
        "使用 PrivateLink 连接所有 VPC",
        "在一个中心 VPC 中运行 EC2 软件路由器",
      ],
      answer: [1],

  <script>
(function () {
  "use strict";

  const DATA = window.SAP_DATA;
  const METHOD = window.SAP_METHOD;
  const BANK_KEY = "sapc02-bank-data-v1";
  let BANK = null;
  const STORE_KEY = "sapc02-study-v1";
  const DAY = 24 * 60 * 60 * 1000;
  // Leitner 盒子对应的复习间隔（天），盒子 0 表示当天需重学
  const INTERVALS = [0, 1, 2, 4, 8, 16, 32];
  const MASTERED_BOX = 4;
  const LETTERS = "ABCDEFGH";

  const app = document.getElementById("app");

  // ---------------- 存储 ----------------
  function normalizeState(s) {
    s = s && typeof s === "object" ? s : {};
    const bank = s.bank && typeof s.bank === "object" ? s.bank : {};
    return {
      cards: s.cards || {},
      questions: s.questions || {},
      wrong: s.wrong || [],
      bank: { rec: bank.rec || {}, wrong: bank.wrong || [], ui: bank.ui || {}, recallUi: bank.recallUi || {} },
      tipsDone: s.tipsDone || {},
    };
  }
  function loadState() {
    try {
      return normalizeState(JSON.parse(localStorage.getItem(STORE_KEY)));
    } catch (_) {
      return normalizeState(null);
    }
  }
  let state = loadState();
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

  // ---------------- 工具函数 ----------------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function domainName(d) { return DATA.domains[d] ? DATA.domains[d].name : d; }
  function domainOptions(selected, withAll = true) {
    const opts = withAll ? [`<option value="all">全部领域</option>`] : [];
    for (const [k, v] of Object.entries(DATA.domains)) {
      opts.push(`<option value="${k}" ${selected === k ? "selected" : ""}>${esc(v.name)}（${v.weight}%）</option>`);
    }
    return opts.join("");
  }
  function sameSet(a, b) {
    if (a.length !== b.length) return false;
    const s = new Set(a);
    return b.every((x) => s.has(x));
  }

  // ---------------- 闪卡调度 ----------------
  function cardState(id) { return state.cards[id] || { box: 0, due: 0, seen: 0 }; }
  function isDue(id, now = Date.now()) {
    const c = state.cards[id];
    return !c || c.due <= now;
  }
  function gradeCard(id, grade) {
    const c = cardState(id);
    if (grade === 0) c.box = 0;
    else if (grade === 1) c.box = Math.max(1, c.box);
    else c.box = Math.min(INTERVALS.length - 1, c.box + 1);
    c.due = Date.now() + INTERVALS[c.box] * DAY;
    c.seen += 1;
    state.cards[id] = c;
    save();
  }

  // ---------------- 视图：概览 ----------------
  function renderHome() {
    const now = Date.now();
    const total = DATA.cards.length;
    const mastered = DATA.cards.filter((c) => cardState(c.id).box >= MASTERED_BOX).length;
    const due = DATA.cards.filter((c) => isDue(c.id, now)).length;
    const qDone = DATA.questions.filter((q) => state.questions[q.id]).length;
    const qRight = DATA.questions.filter((q) => state.questions[q.id] && state.questions[q.id].lastCorrect).length;

    const rows = Object.entries(DATA.domains).map(([k, v]) => {
      const cs = DATA.cards.filter((c) => c.d === k);
      const m = cs.filter((c) => cardState(c.id).box >= MASTERED_BOX).length;
      const learning = cs.filter((c) => { const b = cardState(c.id).box; return b > 0 && b < MASTERED_BOX; }).length;
      const pm = cs.length ? (m / cs.length) * 100 : 0;
      const pl = cs.length ? (learning / cs.length) * 100 : 0;
      return `
        <div class="domain-row">
          <div class="head"><span>${esc(v.name)} <span class="pill">考试占比 ${v.weight}%</span></span><span>${m}/${cs.length} 已掌握</span></div>
          <div class="bar"><i class="ok" style="width:${pm}%"></i><i class="mid" style="width:${pl}%"></i></div>
        </div>`;
    }).join("");

    const bankDone = BANK ? BANK.list.filter((q) => state.bank.rec[q.id]).length : 0;
    const bankRight = BANK ? BANK.list.filter((q) => state.bank.rec[q.id] && state.bank.rec[q.id].last).length : 0;

    app.innerHTML = `
      <div class="panel start">
        <h3>病急乱投医？从这里开始</h3>
        <p style="margin:0 0 12px">先花 20 分钟读完 <a href="#/method">方法论</a>（四步审题法 + 33 条妙招 + 产品对决表），再按主题刷 <a href="#/bank">真题库</a>：第一轮只看“题干抓手 → 答案联想”，建立条件反射。</p>
        <div class="grid">
          <div class="stat"><div class="num">${BANK ? `${bankDone}/${BANK.list.length}` : "未导入"}</div><div class="label">真题库已做${BANK ? `，最近正确率 ${bankDone ? Math.round((bankRight / bankDone) * 100) : 0}%` : ""}</div></div>
          <div class="stat"><div class="num">${state.bank.wrong.length}</div><div class="label">真题错题</div></div>
          <div class="stat"><div class="num">${Object.keys(state.tipsDone).length}/${METHOD.tips.length}</div><div class="label">已掌握的妙招</div></div>
        </div>
      </div>
      <div class="grid">
        <div class="panel stat"><div class="num">${due}</div><div class="label">今日待复习闪卡</div></div>
        <div class="panel stat"><div class="num">${mastered}/${total}</div><div class="label">已掌握闪卡</div></div>
        <div class="panel stat"><div class="num">${qDone ? Math.round((qRight / qDone) * 100) : 0}%</div><div class="label">练习题最近正确率（${qDone}/${DATA.questions.length} 已做）</div></div>
        <div class="panel stat"><div class="num">${state.wrong.length}</div><div class="label">错题本</div></div>
      </div>
      <div class="panel">
        <h3>各领域掌握度</h3>
        <p class="muted" style="margin-top:0">绿色为已掌握（连续答对、间隔 ≥ 8 天），黄色为学习中。</p>
        ${rows}
      </div>
      <div class="panel">
        <h3>建议的每日节奏</h3>
        <p style="margin:0">先清空 <a href="#/cards">闪卡</a> 的到期复习，再做 10 道 <a href="#/quiz">练习题</a>，最后回顾 <a href="#/wrong">错题本</a>。考前用 <a href="#/keywords">关键词速查</a> 过一遍“题干关键词 → 服务”的映射。</p>
        <div class="actions">
          <button class="btn" id="export">导出进度</button>
          <button class="btn" id="import">导入进度</button>
          <button class="btn bad" id="reset">重置全部进度</button>
        </div>
      </div>`;

    document.getElementById("export").onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `sapc02-progress-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    };
    document.getElementById("import").onclick = () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json";
      input.onchange = async () => {
        try {
          state = normalizeState(JSON.parse(await input.files[0].text()));
          save();
          renderHome();
        } catch (e) {
          alert("导入失败：文件格式不正确");
        }
      };
      input.click();
    };
    document.getElementById("reset").onclick = () => {
      if (confirm("确定清空所有学习进度？此操作不可撤销。")) {
        state = normalizeState(null);
        save();
        renderHome();
      }
    };
  }

  // ---------------- 视图：闪卡 ----------------
  const cardSession = { domain: "all", mode: "due", queue: [], idx: 0, flipped: false };

  function buildCardQueue() {
    let pool = DATA.cards.filter((c) => cardSession.domain === "all" || c.d === cardSession.domain);
    if (cardSession.mode === "due") pool = pool.filter((c) => isDue(c.id));
    if (cardSession.mode === "weak") pool = pool.filter((c) => state.cards[c.id] && cardState(c.id).box <= 1);
    cardSession.queue = shuffle(pool).map((c) => c.id);
    cardSession.idx = 0;
    cardSession.flipped = false;
  }

  function renderCards() {
    const { queue, idx, flipped } = cardSession;
    const toolbar = `
      <div class="toolbar">
        <select id="c-domain">${domainOptions(cardSession.domain)}</select>
        <select id="c-mode">
          <option value="due" ${cardSession.mode === "due" ? "selected" : ""}>到期复习</option>
          <option value="all" ${cardSession.mode === "all" ? "selected" : ""}>全部随机</option>
          <option value="weak" ${cardSession.mode === "weak" ? "selected" : ""}>薄弱卡片</option>
        </select>
        <span class="progress-text">${queue.length ? `${Math.min(idx + 1, queue.length)} / ${queue.length}` : ""}</span>
      </div>`;

    if (idx >= queue.length) {
      app.innerHTML = toolbar + `
        <div class="panel empty">
          <h3>${queue.length ? "本轮完成！" : "当前没有需要复习的卡片"}</h3>
          <p>${cardSession.mode === "due" ? "可以切换到“全部随机”继续刷，或去做练习题。" : "换个筛选条件再来一轮吧。"}</p>
          <button class="btn primary" id="c-restart">再来一轮</button>
        </div>`;
      bindCardToolbar();
      document.getElementById("c-restart").onclick = () => { buildCardQueue(); renderCards(); };
      return;
    }

    const card = DATA.cards.find((c) => c.id === queue[idx]);
    const cs = cardState(card.id);
    app.innerHTML = toolbar + `
      <div class="panel flashcard" id="fc">
        <div>
          <span class="pill domain">${esc(domainName(card.d))}</span>
          ${card.tags.map((t) => `<span class="pill">${esc(t)}</span>`).join("")}
          <span class="pill">盒子 ${cs.box}</span>
        </div>
        <div class="q">${esc(card.q)}</div>
        ${flipped ? `<div class="a">${esc(card.a)}</div>` : `<div class="hint">先在脑中回答，再点击卡片或按空格查看答案</div>`}
      </div>
      ${flipped ? `
        <div class="grade">
          <button class="btn bad" data-g="0">1 · 不会（今天重学）</button>
          <button class="btn mid" data-g="1">2 · 模糊</button>
          <button class="btn ok" data-g="2">3 · 记住了</button>
        </div>` : ""}`;

    bindCardToolbar();
    document.getElementById("fc").onclick = () => { if (!cardSession.flipped) { cardSession.flipped = true; renderCards(); } };
    app.querySelectorAll("[data-g]").forEach((b) => { b.onclick = () => submitCardGrade(Number(b.dataset.g)); });
  }

  function submitCardGrade(g) {
    const id = cardSession.queue[cardSession.idx];
    gradeCard(id, g);
    if (g === 0) cardSession.queue.push(id);
    cardSession.idx += 1;
    cardSession.flipped = false;
    renderCards();
  }

  function bindCardToolbar() {
    document.getElementById("c-domain").onchange = (e) => { cardSession.domain = e.target.value; buildCardQueue(); renderCards(); };
    document.getElementById("c-mode").onchange = (e) => { cardSession.mode = e.target.value; buildCardQueue(); renderCards(); };
  }

  // ---------------- 视图：练习题（练习 & 错题共用） ----------------
  function newQuizSession(source) {
    return { source, domain: "all", count: 10, queue: [], idx: 0, selected: [], submitted: false, results: [], order: [] };
  }
  const quizSessions = { quiz: newQuizSession("quiz"), wrong: newQuizSession("wrong") };

  function buildQuizQueue(sess) {
    let pool = sess.source === "wrong"
      ? DATA.questions.filter((q) => state.wrong.includes(q.id))
      : DATA.questions.filter((q) => sess.domain === "all" || q.d === sess.domain);
    pool = shuffle(pool);
    if (sess.source === "quiz" && sess.count > 0) pool = pool.slice(0, sess.count);
    sess.queue = pool.map((q) => q.id);
    sess.idx = 0;
    sess.results = [];
    resetQuestion(sess);
  }

  function resetQuestion(sess) {
    sess.selected = [];
    sess.submitted = false;
    const q = DATA.questions.find((x) => x.id === sess.queue[sess.idx]);
    sess.order = q ? shuffle(q.options.map((_, i) => i)) : [];
  }

  function renderQuiz(sess) {
    const isWrong = sess.source === "wrong";
    const toolbar = isWrong
      ? `<div class="toolbar"><h2 style="margin:0">错题本（${state.wrong.length}）</h2><span class="progress-text">${sess.queue.length ? `${Math.min(sess.idx + 1, sess.queue.length)} / ${sess.queue.length}` : ""}</span></div>`
      : `<div class="toolbar">
          <select id="q-domain">${domainOptions(sess.domain)}</select>
          <select id="q-count">
            ${[5, 10, 20, 0].map((n) => `<option value="${n}" ${sess.count === n ? "selected" : ""}>${n ? n + " 题" : "全部题目"}</option>`).join("")}
          </select>
          <button class="btn" id="q-new">重新出题</button>
          <span class="progress-text">${sess.queue.length ? `${Math.min(sess.idx + 1, sess.queue.length)} / ${sess.queue.length}` : ""}</span>
        </div>`;

    if (!sess.queue.length || sess.idx >= sess.queue.length) {
      app.innerHTML = toolbar + (sess.queue.length ? quizSummary(sess) : `
        <div class="panel empty">
          ${isWrong ? "<h3>错题本是空的</h3><p>在练习中答错的题会自动加入这里，答对后自动移出。</p>" : "<h3>没有符合条件的题目</h3>"}
        </div>`);
      bindQuizToolbar(sess);
      const again = document.getElementById("q-again");
      if (again) again.onclick = () => { buildQuizQueue(sess); renderQuiz(sess); };
      return;
    }

    const q = DATA.questions.find((x) => x.id === sess.queue[sess.idx]);
    const multi = q.answer.length > 1;
    const correct = sess.submitted && sameSet(sess.selected, q.answer);

    const opts = sess.order.map((origIdx, pos) => {
      let cls = "option";
      if (sess.submitted) {
        if (q.answer.includes(origIdx)) cls += " correct";
        else if (sess.selected.includes(origIdx)) cls += " wrong";
      } else if (sess.selected.includes(origIdx)) cls += " selected";
      return `<button class="${cls}" data-o="${origIdx}" ${sess.submitted ? "disabled" : ""}>
        <span class="letter">${LETTERS[pos]}</span><span>${esc(q.options[origIdx])}</span></button>`;
    }).join("");

    const correctLetters = sess.order.map((o, pos) => (q.answer.includes(o) ? LETTERS[pos] : null)).filter(Boolean).join("、");

    app.innerHTML = toolbar + `
      <div class="panel">
        <span class="pill domain">${esc(domainName(q.d))}</span>
        <span class="pill">${multi ? `多选（选 ${q.answer.length} 项）` : "单选"}</span>
        <div class="stem">${esc(q.stem)}</div>
        <div class="options">${opts}</div>
        ${sess.submitted ? `
          <div class="explain ${correct ? "ok" : "bad"}">
            <strong>${correct ? "回答正确" : `回答错误，正确答案：${correctLetters}`}</strong>
            <div>${esc(q.explain)}</div>
          </div>` : ""}
        <div class="actions">
          ${sess.submitted
            ? `<button class="btn primary" id="q-next">${sess.idx + 1 < sess.queue.length ? "下一题" : "查看结果"}</button>`
            : `<button class="btn primary" id="q-submit" ${sess.selected.length ? "" : "disabled"}>提交答案</button>`}
        </div>
      </div>`;

    bindQuizToolbar(sess);
    app.querySelectorAll("[data-o]").forEach((b) => { b.onclick = () => toggleOption(sess, Number(b.dataset.o)); });
    const submit = document.getElementById("q-submit");
    if (submit) submit.onclick = () => submitQuiz(sess);
    const next = document.getElementById("q-next");
    if (next) next.onclick = () => nextQuestion(sess);
  }

  function toggleOption(sess, o) {
    if (sess.submitted) return;
    const q = DATA.questions.find((x) => x.id === sess.queue[sess.idx]);
    if (q.answer.length > 1) {
      sess.selected = sess.selected.includes(o) ? sess.selected.filter((x) => x !== o) : sess.selected.concat(o);
    } else {
      sess.selected = [o];
    }
    renderQuiz(sess);
  }

  function submitQuiz(sess) {
    if (sess.submitted || !sess.selected.length) return;
    const q = DATA.questions.find((x) => x.id === sess.queue[sess.idx]);
    const ok = sameSet(sess.selected, q.answer);
    sess.submitted = true;
    sess.results.push({ id: q.id, ok });

    const rec = state.questions[q.id] || { attempts: 0, correct: 0 };
    rec.attempts += 1;
    if (ok) rec.correct += 1;
    rec.lastCorrect = ok;
    state.questions[q.id] = rec;
    if (!ok && !state.wrong.includes(q.id)) state.wrong.push(q.id);
    if (ok && sess.source === "wrong") state.wrong = state.wrong.filter((x) => x !== q.id);
    save();
    renderQuiz(sess);
  }

  function nextQuestion(sess) {
    sess.idx += 1;
    resetQuestion(sess);
    renderQuiz(sess);
  }

  function quizSummary(sess) {
    const right = sess.results.filter((r) => r.ok).length;
    const pct = Math.round((right / sess.results.length) * 100);
    const wrongList = sess.results.filter((r) => !r.ok).map((r) => {
      const q = DATA.questions.find((x) => x.id === r.id);
      return `<div class="list-item"><span class="pill domain">${esc(domainName(q.d))}</span><div>${esc(q.stem)}</div></div>`;
    }).join("");
    return `
      <div class="panel">
        <div class="score">${pct}%</div>
        <p>答对 ${right} / ${sess.results.length} 题。${pct >= 75 ? "表现不错，SAP-C02 及格线为 750/1000。" : "继续加油，建议先回顾相关领域的闪卡。"}</p>
        ${wrongList ? `<h3>本轮错题</h3>${wrongList}` : ""}
        <div class="actions"><button class="btn primary" id="q-again">再练一轮</button></div>
      </div>`;
  }

  function bindQuizToolbar(sess) {
    if (sess.source !== "quiz") return;
    document.getElementById("q-domain").onchange = (e) => { sess.domain = e.target.value; buildQuizQueue(sess); renderQuiz(sess); };
    document.getElementById("q-count").onchange = (e) => { sess.count = Number(e.target.value); buildQuizQueue(sess); renderQuiz(sess); };
    document.getElementById("q-new").onclick = () => { buildQuizQueue(sess); renderQuiz(sess); };
  }

  // ---------------- 真题库（本地导入 CSV） ----------------
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", i = 0, inQuotes = false;
    if (text.charCodeAt(0) === 0xfeff) i = 1;
    for (; i < text.length; i++) {
      const ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
        } else field += ch;
      } else if (ch === '"') inQuotes = true;
      else if (ch === ",") { row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += ch;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim()));
  }

  function splitOptions(s) {
    const out = {};
    String(s).split(/；(?=[A-H]：)/).forEach((p) => {
      const m = p.trim().match(/^([A-H])：([\s\S]*)$/);
      if (m) out[m[1]] = m[2].trim();
    });
    return out;
  }

  function bankFromCSV(text) {
    const rows = parseCSV(text);
    const head = rows.shift() || [];
    const col = (name) => head.indexOf(name);
    const need = ["原题号", "原题干", "全部选项", "题库答案"];
    if (need.some((n) => col(n) < 0)) throw new Error("缺少必要列：" + need.filter((n) => col(n) < 0).join("、"));
    const get = (r, n) => (col(n) >= 0 ? (r[col(n)] || "").trim() : "");
    const list = rows.map((r) => {
      const options = splitOptions(get(r, "全部选项"));
      const answer = (get(r, "题库答案").match(/[A-H]/g) || []).filter((l) => options[l]);
      return {
        id: Number(get(r, "原题号")),
        topic: get(r, "主题分类") || "未分类",
        type: get(r, "题型"),
        grip: get(r, "题干抓手"),
        hint: get(r, "答案联想"),
        memo: get(r, "关联记忆短句"),
        split: get(r, "多选拆记"),
        breakdown: get(r, "长题拆解"),
        unverified: get(r, "核验状态") === "待核验",
        note: get(r, "核验备注"),
        stem: get(r, "原题干"),
        options,
        answer,
        explain: get(r, "原解析"),
      };
    }).filter((q) => q.id && q.stem && Object.keys(q.options).length);
    if (!list.length) throw new Error("没有解析出题目");
    return list;
  }

  function setBank(list) {
    list.sort((a, b) => a.id - b.id);
    const byId = {};
    list.forEach((q) => { byId[q.id] = q; });
    const topics = [...new Set(list.map((q) => q.topic))];
    BANK = { list, byId, topics };
  }

  function persistBank(list) {
    try { localStorage.setItem(BANK_KEY, JSON.stringify(list)); return true; } catch (_) { return false; }
  }

  async function initBank() {
    if (typeof window.SAP_BANK_CSV === "string") {
      try { setBank(bankFromCSV(window.SAP_BANK_CSV)); return; } catch (_) { /* 内嵌数据损坏时退回其他来源 */ }
    }
    try {
      const cached = localStorage.getItem(BANK_KEY);
      if (cached) { setBank(JSON.parse(cached)); return; }
    } catch (_) { /* 缓存损坏时忽略，走下面的加载 */ }
    if (location.protocol.startsWith("http")) {
      try {
        const res = await fetch("bank.csv", { cache: "no-store" });
        if (res.ok) {
          const list = bankFromCSV(await res.text());
          setBank(list);
          persistBank(list);
        }
      } catch (_) { /* 同目录没有 bank.csv 时保持未导入状态 */ }
    }
  }

  function importBankFile(onDone) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".csv,text/csv";
    input.onchange = async () => {
      try {
        const list = bankFromCSV(await input.files[0].text());
        setBank(list);
        const ok = persistBank(list);
        alert(`已导入 ${list.length} 道题${ok ? "" : "（浏览器存储空间不足，本次仅在当前页面有效）"}`);
        onDone();
      } catch (e) {
        alert("导入失败：" + e.message);
      }
    };
    input.click();
  }

  const bankSess = Object.assign(
    { topic: "all", scope: "all", mode: "study", order: "seq", list: [], idx: 0, selected: [], submitted: false, showGrip: false },
    state.bank.ui
  );

  function saveBankUi() {
    const { topic, scope, mode, order } = bankSess;
    state.bank.ui = { topic, scope, mode, order, pos: bankSess.list[bankSess.idx] };
    save();
  }

  function buildBankList(keepId) {
    let pool = BANK.list.filter((q) => bankSess.topic === "all" || q.topic === bankSess.topic);
    if (bankSess.scope === "reliable") pool = pool.filter((q) => !q.unverified);
    if (bankSess.scope === "unverified") pool = pool.filter((q) => q.unverified);
    if (bankSess.scope === "wrong") pool = pool.filter((q) => state.bank.wrong.includes(q.id));
    if (bankSess.scope === "todo") pool = pool.filter((q) => !state.bank.rec[q.id]);
    if (bankSess.scope === "multi") pool = pool.filter((q) => q.answer.length > 1);
    if (bankSess.order === "random") pool = shuffle(pool);
    bankSess.list = pool.map((q) => q.id);
    const at = keepId ? bankSess.list.indexOf(keepId) : -1;
    bankSess.idx = at >= 0 ? at : 0;
    resetBankQuestion();
  }

  function resetBankQuestion() {
    bankSess.selected = [];
    bankSess.submitted = false;
    bankSess.showGrip = false;
  }

  function openBankQuestion(id) {
    if (!BANK || !BANK.byId[id]) return false;
    if (!bankSess.list.includes(id)) {
      bankSess.topic = "all";
      bankSess.scope = "all";
      bankSess.order = "seq";
    }
    buildBankList(id);
    bankSess.built = true;
    return true;
  }

  function renderBank() {
    if (!BANK) {
      app.innerHTML = `
        <div class="panel">
          <h2>真题库</h2>
          <p>导入你整理的题库 CSV（需包含“原题号、原题干、全部选项、题库答案”等列，推荐同时包含“题干抓手、答案联想、核验状态”）。数据只保存在本机浏览器，不会上传。</p>
          <p class="muted">也可以把 CSV 重命名为 <code>bank.csv</code> 放在 <code>index.html</code> 同目录，用本地 HTTP 服务打开时会自动加载。</p>
          <div class="actions" style="justify-content:flex-start"><button class="btn primary" id="b-import">导入 CSV</button></div>
        </div>`;
      document.getElementById("b-import").onclick = () => importBankFile(() => { buildBankList(); renderBank(); });
      return;
    }
    if (!bankSess.built) { buildBankList(bankSess.pos); bankSess.built = true; }

    const opt = (v, label, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${label}</option>`;
    const count = (t) => BANK.list.filter((q) => q.topic === t).length;
    const toolbar = `
      <div class="toolbar">
        <select id="b-topic">${opt("all", `全部主题（${BANK.list.length}）`, bankSess.topic)}${BANK.topics.map((t) => opt(t, `${t}（${count(t)}）`, bankSess.topic)).join("")}</select>
        <select id="b-scope">
          ${opt("all", "全部题目", bankSess.scope)}${opt("reliable", "仅可靠题", bankSess.scope)}${opt("unverified", "仅待核验", bankSess.scope)}
          ${opt("multi", "仅多选题", bankSess.scope)}${opt("todo", "未做过", bankSess.scope)}${opt("wrong", `错题（${state.bank.wrong.length}）`, bankSess.scope)}
        </select>
        <select id="b-mode">${opt("study", "背题模式", bankSess.mode)}${opt("practice", "练习模式", bankSess.mode)}</select>
        <select id="b-order">${opt("seq", "按题号", bankSess.order)}${opt("random", "随机", bankSess.order)}</select>
        <input id="b-jump" type="number" min="1" placeholder="题号" style="width:90px" />
        <span class="progress-text">${bankSess.list.length ? `${bankSess.idx + 1} / ${bankSess.list.length}` : ""}</span>
      </div>`;

    if (!bankSess.list.length) {
      app.innerHTML = toolbar + `<div class="panel empty">当前筛选条件下没有题目</div>` + bankFooter();
      bindBank();
      return;
    }

    const q = BANK.byId[bankSess.list[bankSess.idx]];
    const reveal = bankSess.mode === "study" || bankSess.submitted;
    const correct = bankSess.submitted && sameSet(bankSess.selected, q.answer);
    const rec = state.bank.rec[q.id];
    const multi = q.answer.length > 1;
    const relatedTips = (tipsByQuestion[q.id] || []).map((i) => METHOD.tips[i]);

    const opts = Object.entries(q.options).map(([k, v]) => {
      let cls = "option";
      if (reveal && q.answer.includes(k)) cls += " correct";
      else if (reveal && bankSess.selected.includes(k)) cls += " wrong";
      else if (bankSess.selected.includes(k)) cls += " selected";
      return `<button class="${cls}" data-o="${k}" ${reveal ? "disabled" : ""}><span class="letter">${k}</span><span>${esc(v)}</span></button>`;
    }).join("");

    app.innerHTML = toolbar + `
      <div class="panel">
        <div>
          <span class="pill domain">原题 ${q.id}</span>
          <span class="pill">${esc(q.topic)}</span>
          <span class="pill">${multi ? `多选（选 ${q.answer.length} 项）` : "单选"}</span>
          ${q.unverified ? `<span class="pill warn">待核验</span>` : ""}
          ${rec ? `<span class="pill">做过 ${rec.attempts} 次 · 对 ${rec.correct} 次</span>` : ""}
        </div>
        ${bankSess.mode === "practice" && !reveal ? `
          <div class="grip-line">${bankSess.showGrip
            ? `<strong>题干抓手：</strong>${esc(q.grip)}`
            : `<button class="btn" id="b-grip">看一眼题干抓手（H）</button>`}</div>` : `
          <div class="grip-line"><strong>题干抓手：</strong>${esc(q.grip)} <span class="muted">→</span> <strong>答案联想：</strong>${esc(q.hint)}</div>`}
        <div class="stem">${esc(q.stem)}</div>
        <div class="options">${opts}</div>
        ${reveal ? `
          <div class="explain ${bankSess.mode === "practice" ? (correct ? "ok" : "bad") : ""}">
            <strong>${bankSess.mode === "practice" ? (correct ? "回答正确 · " : "回答错误 · ") : ""}题库答案：${q.answer.join("、") || "（缺失）"}</strong>
            ${q.memo ? `<div><strong>记忆短句：</strong>${esc(q.memo)}</div>` : ""}
            ${multi && q.split ? `<div><strong>多选拆记：</strong>${esc(q.split)}</div>` : ""}
            ${q.unverified ? `<div class="warn-text"><strong>核验备注：</strong>${esc(q.note || "原答案存在疑点，请对照技术逻辑判断")}</div>` : ""}
            ${relatedTips.length ? `<div><strong>相关妙招：</strong>${relatedTips.map((t) => `<a href="#/method">${esc(t.title)}</a>`).join("；")}</div>` : ""}
            ${q.explain ? `<details><summary>原解析</summary><div>${esc(q.explain)}</div></details>` : ""}
          </div>` : ""}
        <div class="actions">
          <button class="btn" id="b-prev" ${bankSess.idx === 0 ? "disabled" : ""}>上一题</button>
          ${bankSess.mode === "practice" && !reveal ? `<button class="btn primary" id="b-submit" ${bankSess.selected.length ? "" : "disabled"}>提交答案</button>` : ""}
          <button class="btn ${reveal ? "primary" : ""}" id="b-next" ${bankSess.idx >= bankSess.list.length - 1 ? "disabled" : ""}>下一题</button>
        </div>
      </div>` + bankFooter();
    bindBank(q);
  }

  function bankFooter() {
    return `<div class="actions" style="justify-content:flex-start">
      <span class="muted">已导入 ${BANK.list.length} 题，其中待核验 ${BANK.list.filter((q) => q.unverified).length} 题。</span>
      <button class="btn" id="b-reimport">重新导入 CSV</button>
      <button class="btn bad" id="b-clear">移除题库</button>
    </div>`;
  }

  function bindBank(q) {
    const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el[ev] = fn; };
    const refilter = (key) => (e) => { bankSess[key] = e.target.value; buildBankList(); saveBankUi(); renderBank(); };
    on("b-topic", "onchange", refilter("topic"));
    on("b-scope", "onchange", refilter("scope"));
    on("b-order", "onchange", refilter("order"));
    on("b-mode", "onchange", (e) => { bankSess.mode = e.target.value; resetBankQuestion(); saveBankUi(); renderBank(); });
    on("b-jump", "onkeydown", (e) => {
      if (e.key !== "Enter") return;
      const id = Number(e.target.value);
      if (!openBankQuestion(id)) { alert("题库中没有这个题号"); return; }
      saveBankUi(); renderBank();
    });
    on("b-prev", "onclick", () => moveBank(-1));
    on("b-next", "onclick", () => moveBank(1));
    on("b-submit", "onclick", submitBank);
    on("b-grip", "onclick", () => { bankSess.showGrip = true; renderBank(); });
    on("b-reimport", "onclick", () => importBankFile(() => { buildBankList(); renderBank(); }));
    on("b-clear", "onclick", () => {
      if (typeof window.SAP_BANK_CSV === "string") { alert("当前题库内嵌在 HTML 文件中，无法移除。"); return; }
      if (!confirm("从本机浏览器移除已导入的题库？（做题记录会保留）")) return;
      localStorage.removeItem(BANK_KEY);
      BANK = null;
      renderBank();
    });
    if (q) app.querySelectorAll("[data-o]").forEach((b) => { b.onclick = () => toggleBankOption(q, b.dataset.o); });
  }

  function toggleBankOption(q, k) {
    if (bankSess.mode !== "practice" || bankSess.submitted || !q.options[k]) return;
    if (q.answer.length > 1) {
      bankSess.selected = bankSess.selected.includes(k) ? bankSess.selected.filter((x) => x !== k) : bankSess.selected.concat(k);
    } else bankSess.selected = [k];
    renderBank();
  }

  function submitBank() {
    const q = BANK.byId[bankSess.list[bankSess.idx]];
    if (bankSess.submitted || !bankSess.selected.length || !q.answer.length) return;
    const ok = sameSet(bankSess.selected, q.answer);
    bankSess.submitted = true;
    const rec = state.bank.rec[q.id] || { attempts: 0, correct: 0 };
    rec.attempts += 1;
    if (ok) rec.correct += 1;
    rec.last = ok;
    state.bank.rec[q.id] = rec;
    if (!ok && !state.bank.wrong.includes(q.id)) state.bank.wrong.push(q.id);
    if (ok && bankSess.scope === "wrong") state.bank.wrong = state.bank.wrong.filter((x) => x !== q.id);
    save();
    renderBank();
  }

  function moveBank(d) {
    const next = bankSess.idx + d;
    if (next < 0 || next >= bankSess.list.length) return;
    bankSess.idx = next;
    resetBankQuestion();
    saveBankUi();
    renderBank();
    window.scrollTo(0, 0);
  }

  // ---------------- 视图：速记（关键词 + 正确选项） ----------------
  const LATIN = /[A-Za-z0-9][A-Za-z0-9\-.:/_]*/g;
  const STOPWORDS = new Set(["aws", "amazon", "a", "an", "the", "to", "of", "and", "or", "in", "on", "for", "with", "by", "id", "api", "s3", "1", "2", "3"]);
  const normWord = (w) => w.toLowerCase().replace(/\.+$/, "");

  // 正确选项中出现、其他选项都没有的英文词（服务名、参数等）
  function distinctRanges(q, letter) {
    const others = new Set();
    Object.entries(q.options).forEach(([l, v]) => {
      if (l !== letter) (v.match(LATIN) || []).forEach((w) => others.add(normWord(w)));
    });
    const text = q.options[letter];
    const ranges = [];
    for (const m of text.matchAll(LATIN)) {
      const w = normWord(m[0]);
      if (!others.has(w) && !STOPWORDS.has(w)) ranges.push([m.index, m.index + m[0].length]);
    }
    return ranges;
  }

  function distinctPhrases(text, ranges) {
    const phrases = [];
    let cur = null;
    ranges.forEach(([s, e]) => {
      if (cur && s - cur[1] <= 2) cur[1] = e;
      else { if (cur) phrases.push(cur); cur = [s, e]; }
    });
    if (cur) phrases.push(cur);
    return [...new Set(phrases.map(([s, e]) => text.slice(s, e).replace(/\.+$/, "")))];
  }

  function markRanges(text, ranges) {
    let out = "", pos = 0;
    ranges.forEach(([s, e]) => {
      out += esc(text.slice(pos, s)) + `<mark>${esc(text.slice(s, e))}</mark>`;
      pos = e;
    });
    return out + esc(text.slice(pos));
  }

  const recall = Object.assign({ topic: "all", kind: "single", mode: "list", term: "", page: 0 }, state.bank.recallUi || {});
  const RECALL_PAGE = 40;
  const revealed = new Set();
  const expanded = new Set();

  function recallPool() {
    const t = recall.term.trim().toLowerCase();
    if (/^\d+$/.test(t)) return BANK.byId[t] && BANK.byId[t].answer.length ? [BANK.byId[t]] : [];
    return BANK.list.filter((q) => {
      if (!q.answer.length) return false;
      if (recall.topic !== "all" && q.topic !== recall.topic) return false;
      if (recall.kind === "single" && q.answer.length !== 1) return false;
      if (recall.kind === "multi" && q.answer.length === 1) return false;
      if (recall.kind === "unverified" && !q.unverified) return false;
      if (recall.kind === "wrong" && !state.bank.wrong.includes(q.id)) return false;
      if (!t) return true;
      if (String(q.id) === t) return true;
      const hay = [q.grip, q.hint, q.memo, ...q.answer.map((l) => q.options[l])].join(" ").toLowerCase();
      return hay.includes(t);
    });
  }

  function saveRecallUi() {
    const { topic, kind, mode, term, page } = recall;
    state.bank.recallUi = { topic, kind, mode, term, page };
    save();
  }

  function recallItem(q) {
    const show = recall.mode === "list" || revealed.has(q.id);
    const answers = q.answer.map((l) => {
      const ranges = distinctRanges(q, l);
      return { l, text: q.options[l], ranges, keys: distinctPhrases(q.options[l], ranges) };
    });
    const keys = [...new Set(answers.flatMap((a) => a.keys))];
    return `
      <div class="panel recall-item" data-id="${q.id}">
        <div class="recall-head">
          <a class="chip" href="#/bank?id=${q.id}">#${q.id}</a>
          <span class="pill">${esc(q.topic)}</span>
          ${q.answer.length > 1 ? `<span class="pill">多选 ${q.answer.length} 项</span>` : ""}
          ${q.unverified ? `<span class="pill warn">待核验</span>` : ""}
        </div>
        <div class="recall-grip">${esc(q.grip || q.memo || q.stem.slice(0, 60))}</div>
        ${show ? `
          ${q.hint ? `<div class="recall-hint"><span class="muted">答案联想：</span>${esc(q.hint)}</div>` : ""}
          ${keys.length ? `<div class="recall-keys"><span class="muted">区分词（其他选项没有）：</span>${keys.map((k) => `<span class="key">${esc(k)}</span>`).join("")}</div>` : ""}
          ${answers.map((a) => `<div class="recall-answer"><span class="letter">${a.l}</span><span>${markRanges(a.text, a.ranges)}</span></div>`).join("")}
          ${q.unverified && q.note ? `<div class="warn-text small">核验备注：${esc(q.note)}</div>` : ""}
          <button class="link-btn" data-expand="${q.id}">${expanded.has(q.id) ? "收起原题" : "展开原题和其他选项"}</button>
          ${expanded.has(q.id) ? `
            <div class="recall-full">
              <div class="stem">${esc(q.stem)}</div>
              ${Object.entries(q.options).map(([k, v]) => `<div class="recall-opt ${q.answer.includes(k) ? "ok" : ""}"><span class="letter">${k}</span><span>${esc(v)}</span></div>`).join("")}
            </div>` : ""}`
        : `<button class="btn" data-reveal="${q.id}">显示正确选项</button>`}
      </div>`;
  }

  function renderRecall() {
    if (!BANK) { renderBank(); return; }
    const pool = recallPool();
    const pages = Math.max(1, Math.ceil(pool.length / RECALL_PAGE));
    recall.page = Math.min(recall.page, pages - 1);
    const items = pool.slice(recall.page * RECALL_PAGE, (recall.page + 1) * RECALL_PAGE);
    const opt = (v, label, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${label}</option>`;
    const pager = pages > 1 ? `
      <div class="actions pager">
        <button class="btn" data-page="-1" ${recall.page === 0 ? "disabled" : ""}>上一页</button>
        <span class="muted">第 ${recall.page + 1} / ${pages} 页</span>
        <button class="btn" data-page="1" ${recall.page >= pages - 1 ? "disabled" : ""}>下一页</button>
      </div>` : "";

    app.innerHTML = `
      <h2>关键词 + 正确选项速记</h2>
      <p class="muted">题目和选项固定成套出现：看到题干关键词，就认出正确选项。正确选项里其他选项都没有的英文服务名/参数已高亮，背这几个词即可在考场上锁定答案。</p>
      <div class="toolbar">
        <select id="r-kind">${opt("single", "单选", recall.kind)}${opt("multi", "多选", recall.kind)}${opt("all", "全部题型", recall.kind)}${opt("unverified", "仅待核验", recall.kind)}${opt("wrong", "真题错题", recall.kind)}</select>
        <select id="r-topic">${opt("all", "全部主题", recall.topic)}${BANK.topics.map((t) => opt(t, t, recall.topic)).join("")}</select>
        <select id="r-mode">${opt("list", "直接显示答案", recall.mode)}${opt("quiz", "自测（先遮住答案）", recall.mode)}</select>
        <input type="search" id="r-term" placeholder="搜关键词、服务名或题号" value="${esc(recall.term)}" />
        <span class="progress-text">共 ${pool.length} 题</span>
      </div>
      ${pager}
      ${items.length ? items.map(recallItem).join("") : `<div class="panel empty">没有符合条件的题目</div>`}
      ${pager}`;

    const refilter = (key) => (e) => { recall[key] = e.target.value; recall.page = 0; revealed.clear(); saveRecallUi(); renderRecall(); };
    document.getElementById("r-kind").onchange = refilter("kind");
    document.getElementById("r-topic").onchange = refilter("topic");
    document.getElementById("r-mode").onchange = refilter("mode");
    const term = document.getElementById("r-term");
    let timer = null;
    term.oninput = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        recall.term = term.value; recall.page = 0; saveRecallUi(); renderRecall();
        const el = document.getElementById("r-term");
        el.focus(); el.setSelectionRange(el.value.length, el.value.length);
      }, 300);
    };
    app.querySelectorAll("[data-page]").forEach((b) => {
      b.onclick = () => { recall.page += Number(b.dataset.page); saveRecallUi(); renderRecall(); window.scrollTo(0, 0); };
    });
    app.querySelectorAll("[data-reveal]").forEach((b) => { b.onclick = () => rerenderRecallItem(Number(b.dataset.reveal), () => revealed.add(Number(b.dataset.reveal))); });
    app.querySelectorAll("[data-expand]").forEach((b) => {
      b.onclick = () => rerenderRecallItem(Number(b.dataset.expand), (id) => { expanded.has(id) ? expanded.delete(id) : expanded.add(id); });
    });
  }

  function rerenderRecallItem(id, mutate) {
    mutate(id);
    const el = app.querySelector(`.recall-item[data-id="${id}"]`);
    if (!el) return;
    const tmp = document.createElement("div");
    tmp.innerHTML = recallItem(BANK.byId[id]);
    const fresh = tmp.firstElementChild;
    el.replaceWith(fresh);
    fresh.querySelectorAll("[data-reveal]").forEach((b) => { b.onclick = () => rerenderRecallItem(id, () => revealed.add(id)); });
    fresh.querySelectorAll("[data-expand]").forEach((b) => {
      b.onclick = () => rerenderRecallItem(id, () => { expanded.has(id) ? expanded.delete(id) : expanded.add(id); });
    });
  }

  // ---------------- 路由与快捷键 ----------------
  let currentView = "home";
  function route() {
    const [view, query] = (location.hash.replace(/^#\//, "") || "home").split("?");
    currentView = ["home", "method", "recall", "bank", "cards", "quiz", "wrong", "keywords"].includes(view) ? view : "home";
    document.querySelectorAll("#tabs a").forEach((a) => a.classList.toggle("active", a.dataset.view === currentView));
    if (currentView === "home") renderHome();
    if (currentView === "method") renderMethod();
    if (currentView === "recall") renderRecall();
    if (currentView === "bank") {
      const id = Number(new URLSearchParams(query || "").get("id"));
      if (id && openBankQuestion(id)) saveBankUi();
      renderBank();
    }
    if (currentView === "cards") { buildCardQueue(); renderCards(); }
    if (currentView === "quiz") { if (!quizSessions.quiz.queue.length) buildQuizQueue(quizSessions.quiz); renderQuiz(quizSessions.quiz); }
    if (currentView === "wrong") { buildQuizQueue(quizSessions.wrong); renderQuiz(quizSessions.wrong); }
    if (currentView === "keywords") renderKeywords();
    window.scrollTo(0, 0);
  }

  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (currentView === "cards" && cardSession.idx < cardSession.queue.length) {
      if (e.key === " ") {
        e.preventDefault();
        if (!cardSession.flipped) { cardSession.flipped = true; renderCards(); }
      } else if (cardSession.flipped && ["1", "2", "3"].includes(e.key)) {
        submitCardGrade(Number(e.key) - 1);
      }
    }
    if (currentView === "bank" && BANK && bankSess.list.length) {
      const q = BANK.byId[bankSess.list[bankSess.idx]];
      const k = e.key.toUpperCase();
      if (e.key.length === 1 && q.options[k]) toggleBankOption(q, k);
      else if (k === "H" && bankSess.mode === "practice") { bankSess.showGrip = true; renderBank(); }
      else if (e.key === "ArrowRight") moveBank(1);
      else if (e.key === "ArrowLeft") moveBank(-1);
      else if (e.key === "Enter") {
        e.preventDefault();
        const revealed = bankSess.mode === "study" || bankSess.submitted;
        revealed ? moveBank(1) : submitBank();
      }
      return;
    }
    if (currentView === "quiz" || currentView === "wrong") {
      const sess = quizSessions[currentView];
      if (sess.idx >= sess.queue.length) return;
      const pos = LETTERS.indexOf(e.key.toUpperCase());
      if (pos >= 0 && pos < sess.order.length && e.key.length === 1) toggleOption(sess, sess.order[pos]);
      else if (e.key === "Enter") {
        e.preventDefault();
        sess.submitted ? nextQuestion(sess) : submitQuiz(sess);
      }
    }
  });

  window.addEventListener("hashchange", route);
  initBank().then(route);
})();

</script>
</body>
